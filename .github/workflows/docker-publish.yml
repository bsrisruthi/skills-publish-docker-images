name: Docker Publish
on:
 push:
  branches:
   - main
permissions: 
 contents: read
 packages: write
jobs:
 build-and-push:
  runs_on: ubuntu-latest
  steps:
  - uses: actions/checkout@v6
  -name: login into container registry
   uses: docker/login-action@v3
   with:
    registry: ghcr.io 
    username: ${{ github.actor }}
    password: ${{ secrets.GITHUB_TOKEN }}
  -name: Build and push docker image
   run: |
     docker build . --tag ghcr.io/bsrisruthi/skills-publish-docker-images/stackoverflown:main
     docker push ghcr.io/bsrisruthi/skills-publish-docker-images/stackoverflown:main
  
 
